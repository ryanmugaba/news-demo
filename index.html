<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personalized News Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: auto; padding: 20px; }
    h3 { margin-bottom: 5px; }
    p { margin: 2px 0; }
    hr { margin: 15px 0; }
    select { padding: 5px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>News Feed</h1>
  <label for="personality">Choose your vibe:</label>
  <select id="personality">
    <option value="Progressive">Progressive</option>
    <option value="Traditional">Traditional</option>
    <option value="Bold">Bold</option>
    <option value="Witty">Witty</option>
  </select>
  <div id="feed"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tabletop.js/1.5.1/tabletop.min.js"></script>
  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7ABkq_By3iWC4GdkGBdTTiZKJIPc6eH_vt-H6IihkptYnIhzqmmvVlR-jLBTuaK7Q8agVTzFhirlW/pubhtml";
    let currentData = [];

    function showNews(data) {
      currentData = data; // save fetched data
      const userPersonality = document.getElementById('personality').value;
      let html = "";
      data.forEach(article => {
        html += `<h3>${article['Title']}</h3>
                 <p><strong>TL;DR:</strong> ${article['TL;DR'] || article['Description'] || 'No summary available'}</p>
                 <p><strong>${userPersonality} version:</strong> ${article[userPersonality] || 'No version available'}</p>
                 <a href="${article['URL']}" target="_blank">Read more</a><hr>`;
      });
      document.getElementById('feed').innerHTML = html;
    }

    function fetchAndShow() {
      Tabletop.init({
        key: sheetURL,
        callback: showNews,
        simpleSheet: true
      });
    }

    // initial fetch
    fetchAndShow();

    // dropdown change just re-renders with chosen personality
    document.getElementById('personality').addEventListener('change', () => {
      showNews(currentData);
    });

    // auto-refresh every 2 minutes (120000 ms)
    setInterval(fetchAndShow, 120000);
  </script>
</body>
</html>
